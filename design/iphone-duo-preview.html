<!doctype html>
<html lang="zh-Hans">
<head>

  <title>Meow · iPhone Duo 设计确认</title>
  <link rel="icon" href="assets/navCat.png">
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", sans-serif; color: #322b2b; background: #f7f3ef; font-synthesis: none; }

    .page { max-width: 1260px; padding: 28px 40px 42px; margin: auto; }
    .masthead { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 22px; border-bottom: 1px solid #e4dad3; }

    .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .poses { display: flex; flex-wrap: wrap; gap: 4px; padding: 5px; background: #eae2db; border-radius: 15px; }
    .poses button { background: transparent; border: 0; padding: 10px 14px; min-height: 40px; border-radius: 11px; font-size: 13px; color: #7b6a62; }
    .poses button[aria-pressed="true"] { background: #fff; color: #3c2c28; font-weight: 650; box-shadow: 0 2px 6px #51332110; }
    .comparison { display: flex; align-items: center; flex-wrap: wrap; gap: 14px; margin-bottom: 16px; }
    .comparison p { margin: 0; color: #81716b; font-size: 12px; line-height: 1.6; }
    .settings { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .settings select, .reset { border: 1px solid #dfd2c8; border-radius: 11px; padding: 10px; background: #fffaf7; min-height: 40px; font-size: 12px; }
    .reset { background: transparent; }
    .stage-caption { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px; font-size: 12px; color: #8a786e; margin: 20px 0 12px; min-height: 20px; }
    #pose-caption { color: #65544b; }
    .stage { display: flex; justify-content: center; overflow: hidden; min-width: 0; padding: 15px 0 30px; }
    .device-space { position: relative; flex-shrink: 0; }
    .device { --screen-w: 951px; --screen-h: 669px; --bar: 84px; --text-scale: 1; --cell-min: 104px; --app-bg: #fff; --app-ink: #171717; --app-muted: #858589; --pink: #fff6f7; --yellow: #ffffe0; --glass: #ffffffb8; --line: #0000000d; --tint: #b84642; position: absolute; top: 0; left: 0; width: calc(var(--screen-w) + 16px); height: calc(var(--screen-h) + 16px); padding: 8px; background: #262424; border-radius: 42px; transform-origin: top left; box-shadow: 0 18px 35px #4e352d20, 0 2px 8px #30242224; }
    .device[data-theme="dark"] { --app-bg: #080808; --app-ink: #f5f5f5; --app-muted: #aaa4a5; --pink: #2c2323; --yellow: #514b42; --glass: #242021dc; --line: #ffffff20; --tint: #ffa5a0; color-scheme: dark; }
    .device[data-layout="dual-grid"] { --cell-min: 100px; }
    .device[data-text="large"] { --text-scale: 2.5; --cell-min: 260px; }
    .screen { width: var(--screen-w); height: var(--screen-h); position: relative; border-radius: 34px; overflow: hidden; color: var(--app-ink); background: var(--app-bg); font-family: ui-rounded, -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans", sans-serif; }
    .app-panes { position: absolute; inset: 0 var(--bar) 0 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .device[data-pose="closed"] .app-panes, .device[data-pose="split-left"] .app-panes, .device[data-pose="split-right"] .app-panes { grid-template-columns: minmax(0, 1fr); }
    .device[data-pose="closed"] .spotlight, .device[data-pose="split-left"] .spotlight, .device[data-pose="split-right"] .spotlight { display: none; }
    .device[data-pose="split-left"] .app-panes { inset: 0 0 0 var(--bar); }
    .device[data-pose="book"] .app-panes { grid-template-columns: calc(var(--screen-w) / 2 - 13.5px) minmax(0, 1fr); column-gap: 27px; }
    .device[data-pose="tabletop"] .app-panes { inset: var(--bar) 0 22px; grid-template-columns: minmax(0, 1fr); grid-template-rows: calc(var(--screen-h) / 2 - var(--bar) - 13.5px) minmax(0, 1fr); row-gap: 27px; }
    .spotlight { margin: 16px; border-radius: 32px; background: var(--pink); overflow: auto; min-width: 0; min-height: 0; scrollbar-width: thin; }
    .spotlight-inner { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
    .portrait { flex-shrink: 0; display: grid; place-items: center; width: 168px; height: 168px; border-radius: 50%; background: var(--yellow); margin-bottom: 18px; }
    .portrait img { width: 112px; height: 112px; object-fit: contain; }
    .spotlight p { font-size: calc(16px * var(--text-scale)); margin: 8px 0 0; color: var(--app-muted); line-height: 1.5; }
    .spotlight .eyebrow { font-size: calc(15px * var(--text-scale)); margin: 0 0 8px; }
    .spotlight h2 { font-size: calc(34px * var(--text-scale)); line-height: 1.16; letter-spacing: -.035em; margin: 0; font-weight: 750; overflow-wrap: anywhere; }
    .gallery { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
    .device[data-pose="open"] .leading-gallery { border-right: 1px solid var(--line); }
    .sound-scroll { flex: 1; min-height: 0; overflow: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: #cbbdb8 transparent; overscroll-behavior: contain; }
    .gallery-heading { margin-bottom: 18px; }
    .gallery-title { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 6px 12px; }
    .sound-range { font-size: calc(11px * var(--text-scale)); color: var(--app-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .gallery-heading h2 { font-size: calc(22px * var(--text-scale)); letter-spacing: -.025em; line-height: 1.2; margin: 0 0 4px; font-weight: 750; }
    .gallery-heading p { margin: 0; font-size: calc(15px * var(--text-scale)); color: var(--app-muted); line-height: 1.4; }
    .cat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(var(--cell-min), 100%), 1fr)); gap: 12px; }
    .cat { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px; border: 0; border-radius: 24px; background: var(--pink); color: var(--app-ink); min-width: 0; }
    .cat img { width: 64px; height: 64px; object-fit: contain; flex-shrink: 0; }
    .cat span { font-size: calc(12px * var(--text-scale)); line-height: 1.3; font-weight: 650; min-height: 32px; overflow-wrap: anywhere; }
    .cat[aria-pressed="true"] { background: var(--yellow); box-shadow: inset 0 0 0 2px #e76a66; }
    .cat[aria-pressed="true"]::after { content: "✓"; position: absolute; right: 8px; top: 8px; width: 17px; height: 17px; border-radius: 50%; color: white; background: #e76a66; display: grid; place-items: center; font-size: 11px; font-weight: 800; }
    .cat:active { opacity: .7; }
    .replay { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--glass); border-top: 1px solid var(--line); backdrop-filter: blur(18px); }
    .replay > img { width: 44px; height: 44px; object-fit: contain; }
    .replay-name { flex: 1; font-weight: 650; font-size: calc(15px * var(--text-scale)); overflow-wrap: anywhere; line-height: 1.3; }
    .replay button { display: flex; align-items: center; justify-content: center; gap: 10px; border: 0; border-radius: 12px; color: var(--tint); background: var(--pink); min-width: 60px; min-height: 56px; padding: 6px 12px; }
    .replay svg { width: 22px; height: 22px; flex-shrink: 0; }
    .replay .replay-label { display: none; }
    .device[data-text="large"] .replay { flex-wrap: wrap; margin-top: 18px; border: 0; }
    .device[data-text="large"] .replay > img { display: none; }
    .device[data-text="large"] .replay-name { flex-basis: 100%; }
    .device[data-text="large"] .replay .replay-label { display: block; font-size: 34px; }
    .system-bar { position: absolute; right: 0; top: 0; bottom: 0; width: var(--bar); display: flex; flex-direction: column; align-items: center; padding: 20px 10px; gap: 16px; border-left: 1px solid var(--line); }
    .clock { font-size: 14px; font-weight: 700; }
    .camera { width: 20px; height: 45px; background: #111; border: 1px solid #363636; border-radius: 18px; }
    .app-wordmark { font-size: 12px; font-weight: 700; text-align: center; line-height: 1.3; max-width: 66px; }
    .system-actions { display: flex; flex-direction: column; gap: 16px; }
    .glass-button { display: grid; place-items: center; width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--glass); box-shadow: 0 2px 12px #00000005; }
    .glass-button img { width: 26px; height: 26px; object-fit: contain; }
    .system-indicator { margin-top: auto; width: 20px; height: 4px; border-radius: 4px; background: var(--app-muted); opacity: .6; }
    .device[data-pose="split-left"] .system-bar { left: 0; right: auto; border-left: 0; border-right: 1px solid var(--line); }
    .device[data-pose="tabletop"] .system-bar { left: 0; bottom: auto; width: 100%; height: var(--bar); padding: 0 22px; flex-direction: row; border-left: 0; border-bottom: 1px solid var(--line); }
    .device[data-pose="tabletop"] .system-actions { flex-direction: row; margin-left: auto; }
    .device[data-pose="tabletop"] .camera, .device[data-pose="tabletop"] .system-indicator { display: none; }
    .device[data-pose="tabletop"] .app-wordmark { font-size: 17px; max-width: none; position: absolute; left: 50%; transform: translateX(-50%); }
    .home-indicator { position: absolute; bottom: 7px; left: calc(50% - 55px); width: 110px; height: 4px; border-radius: 8px; background: var(--app-muted); display: none; }
    .device[data-pose="tabletop"] .home-indicator { display: block; }
    .fold { position: absolute; z-index: 2; pointer-events: none; display: none; }
    .device[data-pose="book"] .fold { display: block; top: 0; bottom: 0; left: calc(50% - 13.5px); width: 27px; background: linear-gradient(90deg, transparent, #9c8f7e18 38%, #8d817126 50%, #9c8f7e18 62%, transparent); border-inline: 1px dashed #ad9b8e35; }
    .device[data-pose="tabletop"] .fold { display: block; left: 0; right: 0; top: calc(50% - 13.5px); height: 27px; background: linear-gradient(transparent, #9c8f7e18 38%, #8d817126 50%, #9c8f7e18 62%, transparent); border-block: 1px dashed #ad9b8e35; }
    .sheet-overlay { position: absolute; z-index: 5; inset: 0; padding: 16px; background: #0004; display: flex; align-items: center; justify-content: center; }
    .device[data-pose="book"] .sheet-overlay { padding-right: calc(var(--bar) + 16px); padding-left: calc(var(--screen-w) / 2 + 25px); }
    .device[data-pose="tabletop"] .sheet-overlay { padding-top: calc(var(--screen-h) / 2 + 25px); }
    .sheet-panel { position: relative; width: 100%; max-width: 400px; max-height: 100%; background: var(--app-bg); color: var(--app-ink); border-radius: 26px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 16px 40px #0002; }
    .sheet-top { padding: 10px 14px 0; }
    .sheet-close { border: 0; width: 36px; height: 36px; border-radius: 50%; font-size: 23px; color: var(--app-muted); background: var(--pink); }
    .sheet-content { overflow: auto; padding: 12px 28px 28px; text-align: center; min-height: 0; }
    .tip-hero { display: flex; align-items: flex-end; justify-content: center; margin: 8px 0 18px; }
    .tip-hero img { width: 54px; height: 54px; object-fit: contain; }
    .tip-hero img:nth-child(2) { width: 68px; height: 68px; margin-bottom: 8px; }
    .sheet-content h2 { font-size: calc(22px * var(--text-scale)); margin: 10px 0 12px; }
    .sheet-content p { font-size: calc(15px * var(--text-scale)); line-height: 1.5; color: var(--app-muted); }
    .treat { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 13px 14px; border: 0; border-radius: 15px; background: var(--pink); color: var(--tint); margin-top: 14px; font-size: calc(16px * var(--text-scale)); font-weight: 650; }
    .treat.primary { background: #e76a66; color: #fff; }
    .treat img { width: 34px; height: 34px; object-fit: contain; }
    .treat small { display: block; font-size: calc(12px * var(--text-scale)); font-weight: 400; margin-top: 3px; }
    .restore { background: none; color: var(--tint); border: 0; padding: 20px 0 0; font-size: calc(15px * var(--text-scale)); }
    #sheet-status { font-size: 13px; }
    .stage-note { text-align: center; font-size: 12px; color: #918079; line-height: 1.65; margin: 3px 0 28px; }
    .evidence { border-top: 1px solid #e4dad3; padding-top: 20px; }
    .evidence summary { font-size: 13px; font-weight: 600; }
    .evidence > p { color: #8b7a72; font-size: 12px; line-height: 1.7; }
    .captures { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 18px; margin-top: 20px; }
    .capture { border: 0; padding: 0; background: transparent; text-align: left; }
    .capture img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; border-radius: 14px; border: 1px solid #e2d8d0; }
    .capture span { display: block; font-size: 12px; color: #81716b; padding: 10px 0; }
    dialog { border: 0; border-radius: 18px; max-width: min(94vw, 850px); max-height: 94vh; padding: 16px; background: #f7f3ef; }
    dialog::backdrop { background: #181314cc; }
    dialog img { max-width: 100%; max-height: 82vh; display: block; margin: 10px auto 0; object-fit: contain; }
    dialog button { float: right; border: 0; background: #eae2db; border-radius: 20px; padding: 9px 16px; }
    @media (max-width: 700px) { .page { padding: 20px 16px 28px; } .brand span { display: none; } .intro { margin-top: 24px; } .review-tag { display: none; } .controls { justify-content: flex-start; } .poses { width: 100%; } .poses button { flex: 1 0 auto; padding: 9px 11px; } .settings { width: 100%; } .settings select { flex: 1; min-width: 0; } .captures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (prefers-reduced-motion: no-preference) { .cat { transition: background .16s, box-shadow .16s; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="masthead"><div class="brand"><img src="assets/navCat.png" alt=""><strong>meow</strong><span>DESIGN REVIEW / 01</span></div><a class="pr-link" href="https://github.com/newbdez33/meow/pull/11" target="_blank" rel="noopener">查看 PR #11 ↗</a></header>
    <section class="intro"><div><h1>iPhone Duo · 设计确认</h1><p>点一只猫，听听它的声音。切换屏幕形态，继续刚才的选择。</p></div><span class="review-tag">可交互预览</span></section>

    </div>
    <div class="stage-caption"><span id="pose-caption">正在加载预览…</span><span id="dimensions"></span></div>
    <section class="stage" aria-label="交互设计稿"><div class="device-space" id="device-space"><div class="device" id="device" data-pose="open" data-theme="light" data-text="standard"><div class="screen" id="screen">
      <div class="app-panes">
        <section class="spotlight" aria-label="选中猫咪"><div class="spotlight-inner"><div class="portrait"><img id="portrait" src="assets/c04.png" alt=""></div><p class="eyebrow" id="spotlight-eyebrow"></p><h2 id="spotlight-title"></h2><p data-copy="soundboard_hint"></p></div></section>

          <div class="sound-scroll" id="leading-scroll">
            <div class="gallery-heading"><div class="gallery-title"><h2 id="leading-title" data-copy="soundboard_title"></h2><span class="sound-range" id="leading-range"></span></div><p data-copy="soundboard_hint"></p></div>
            <div class="cat-grid" id="leading-grid"></div>
          </div>
        </section>
        <section class="gallery" id="gallery" aria-labelledby="gallery-title"><div class="sound-scroll" id="sound-scroll"><div class="gallery-heading"><div class="gallery-title"><h2 id="gallery-title"></h2><span class="sound-range" id="trailing-range" hidden></span></div><p data-copy="soundboard_hint"></p></div><div class="cat-grid" id="cat-grid"></div></div><div class="replay" id="replay" hidden><img id="replay-image" alt=""><span class="replay-name" id="replay-name"></span><button id="replay-button" aria-label="再听一次"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10a9 9 0 1 1 1.5 8M3 4v6h6"/></svg><span class="replay-label" data-copy="soundboard_replay"></span></button></div></section>
      </div>
      <aside class="system-bar" aria-label="系统栏示意"><span class="clock" aria-hidden="true">9:41</span><span class="camera" aria-hidden="true"></span><span class="app-wordmark" data-copy="title"></span><div class="system-actions"><button class="glass-button" id="support-button" aria-label="去掉广告"><img src="assets/navCan.png" alt=""></button><button class="glass-button" id="share-button" aria-label="分享 App"><img src="assets/navCat.png" alt=""></button></div><span class="system-indicator" aria-hidden="true"></span></aside>

      <div class="sheet-overlay" id="sheet" hidden><section class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title"><div class="sheet-top"><button class="sheet-close" id="close-sheet" aria-label="关闭">×</button></div><div class="sheet-content"><div id="support-content"><div class="tip-hero"><img src="assets/tipMug.png" alt=""><img src="assets/c04.png" alt=""><img src="assets/tipCan.png" alt=""></div><h2 id="sheet-title" data-copy="tip_title"></h2><p data-copy="tip_body"></p><button class="treat primary" id="can-purchase"><img src="assets/tipCan.png" alt=""><span><span id="can-price"></span><small data-copy="tip_can_note"></small></span></button><button class="treat" id="coffee-purchase"><img src="assets/tipMug.png" alt=""><span id="coffee-price"></span></button><button class="restore" id="restore" data-copy="tip_restore"></button></div><div id="share-content" hidden><img src="assets/navCat.png" width="80" height="80" alt=""><h2 data-copy="title"></h2><p data-copy="subtitle"></p><a href="https://apps.apple.com/app/id826362662" target="_blank" rel="noopener">App Store ↗</a></div><p id="sheet-status" aria-live="polite"></p></div></section></div>
    </div></div></div></section>
    <p class="stage-note" id="preview-status" aria-live="polite">HTML 交互稿 · 系统栏、折痕与窗口尺寸为设计示意；原生截图见下方。</p>
    <details class="evidence"><summary>对照原生截图 · iOS 27.0</summary><p>这些是本 PR「大猫展示」方案的 iPhone / iPad 实际截图。「双屏猫叫」为新增 HTML 方案，Duo 折叠姿态尚待对应运行时验证。</p><div class="captures"><button class="capture" data-capture="compact-en.png"><img src="captures/compact-en.png" alt="英文 iPhone 紧凑布局" loading="lazy"><span>iPhone · English</span></button><button class="capture" data-capture="regular-en.png"><img src="captures/regular-en.png" alt="英文 iPad 双窗格布局" loading="lazy"><span>iPad · English</span></button><button class="capture" data-capture="regular-zh-dark.png"><img src="captures/regular-zh-dark.png" alt="中文 iPad 暗色布局" loading="lazy"><span>iPad · 中文 / 深色</span></button><button class="capture" data-capture="compact-ja-accessibility.png"><img src="captures/compact-ja-accessibility.png" alt="日文 iPhone 辅助大字号布局" loading="lazy"><span>iPhone · 日本語 / 辅助字号</span></button></div></details>
  </main>
  <dialog id="capture-dialog" aria-label="原生截图"><button id="close-capture">关闭</button><img id="capture-image" alt="原生截图"></dialog>
  <script src="iphone-duo-preview.js" defer></script>
